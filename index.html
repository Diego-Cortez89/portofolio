<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudarno Lamhot — IT Infrastructure & Data Center Engineer</title>
<meta name="description" content="Portfolio of Sudarno Lamhot: IT infrastructure, data center and ICT operations engineer for 24/7 critical environments, available for Oil & Gas roles in the UAE and GCC.">
<meta property="og:title" content="Sudarno Lamhot — IT Infrastructure & Data Center Engineer">
<meta property="og:description" content="Tier III/IV data center build and operations, 24/7 critical infrastructure. Available for Oil & Gas ICT roles in the UAE and GCC.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#14303D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%2314303D%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Arial,sans-serif%27 font-size=%2728%27 font-weight=%27700%27 fill=%27%23F2A900%27 text-anchor=%27middle%27%3ESL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F2; --surface:#FFFFFF; --ink:#14303D; --steel:#4F6772; --rule:#C5D1D6;
  --flow:#F2A900; --flow-ink:#7A5400; --ok:#1E8C5A; --hold:#B4541A; --focus:#1F6FEB;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E2129; --surface:#132C36; --ink:#E6EEF0; --steel:#9DB2BB; --rule:#28434E;
    --flow:#F2B21C; --flow-ink:#F2B21C; --ok:#3DBB7F; --hold:#F08A4B; --focus:#6EA8FE;
  }
}
:root[data-theme="dark"]{
  --paper:#0E2129; --surface:#132C36; --ink:#E6EEF0; --steel:#9DB2BB; --rule:#28434E;
  --flow:#F2B21C; --flow-ink:#F2B21C; --ok:#3DBB7F; --hold:#F08A4B; --focus:#6EA8FE;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;letter-spacing:.005em}
h2{font-size:clamp(34px,5vw,52px);font-weight:700}
h3{font-size:24px;font-weight:600}
p{margin:0 0 1em;max-width:68ch}
.muted{color:var(--steel)}
[hidden]{display:none!important}

/* top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:64px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:20px}
.mark svg{flex:none}
nav.links{margin-left:auto;display:flex;gap:4px}
nav.links a{text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;border-radius:6px;color:var(--steel)}
nav.links a.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--flow)}
.iconbtn{background:none;border:1px solid var(--rule);color:var(--ink);width:38px;height:38px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
@media (max-width:760px){nav.links{display:none}.iconbtn{margin-left:auto}}

/* hero */
.hero{padding:72px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:end}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px;color:var(--steel);margin-bottom:22px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:ping 2.4s infinite}
.status.hold i{background:var(--hold);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(56px,10vw,118px);font-weight:700;line-height:.9}
.hero .role{font-family:var(--display);font-weight:500;font-size:clamp(22px,2.6vw,30px);margin:18px 0 18px;color:var(--steel)}
.hero p.pitch{font-size:19px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:8px;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid var(--ink);cursor:pointer;font-family:var(--body);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary::before{content:"";width:4px;height:18px;background:var(--flow);border-radius:2px}
.datasheet{border:1.5px solid var(--ink);background:var(--surface);font-size:15px}
.datasheet .ds-head{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1.5px solid var(--ink);font-family:var(--display);font-weight:600;font-size:18px}
.datasheet .ds-head span:last-child{color:var(--steel);font-weight:500}
.datasheet dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.datasheet dt,.datasheet dd{margin:0;padding:11px 16px;border-bottom:1px solid var(--rule)}
.datasheet dt{color:var(--steel);border-right:1px solid var(--rule)}
.datasheet dd{font-weight:600}
.datasheet dl > :nth-last-child(-n+2){border-bottom:0}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:36px}}

/* section shell */
section.block{padding:72px 0;border-top:1px solid var(--rule)}
.sec-head{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:end;margin-bottom:40px}
.sec-head p{margin:0}
@media (max-width:860px){.sec-head{grid-template-columns:1fr;gap:14px}}

/* career line (the pipeline) */
.pipe{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:0}
.pipe::before{content:"";position:absolute;left:8%;right:8%;top:31px;height:8px;border-radius:4px;background:var(--rule)}
.pipe .flow{position:absolute;left:8%;right:8%;top:33px;height:4px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--flow) 0 14px,transparent 14px 34px);background-size:34px 4px;animation:flow 1.1s linear infinite}
@keyframes flow{to{background-position:34px 0}}
.pipe li{position:relative;text-align:center;z-index:1}
.node{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:0 4px 8px}
.valve{width:70px;height:70px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ink);display:grid;place-items:center;transition:transform .2s,background .2s}
.valve svg{width:34px;height:34px}
.node .txt{display:flex;flex-direction:column;align-items:center}
.node .yr{font-family:var(--display);font-weight:600;font-size:20px}
.node .co{font-size:14px;color:var(--steel);line-height:1.3}
.node[aria-selected="true"] .valve{background:var(--ink);color:var(--paper);transform:scale(1.08)}
.node[aria-selected="true"] .valve svg{stroke:var(--flow)}
.node:hover .valve{transform:scale(1.06)}
.node.next .valve{border-style:dashed;border-color:var(--flow-ink)}
.node.next .yr{color:var(--flow-ink)}
.node.now .valve{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 35%,transparent)}
.panel{margin-top:28px;background:var(--surface);border:1.5px solid var(--ink);display:grid;grid-template-columns:1fr 1.6fr}
.panel .meta{padding:28px;border-right:1px solid var(--rule)}
.panel .meta h3{font-size:30px;margin-bottom:6px}
.panel .meta .when{font-weight:600;margin-top:14px}
.panel .meta .dur{display:inline-block;margin-left:6px;font-weight:500;color:var(--steel)}
.panel .meta .rel{margin-top:22px;padding:14px 16px;background:color-mix(in srgb,var(--flow) 16%,transparent);border-left:4px solid var(--flow);font-size:15px}
.panel .meta .rel b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.panel ul{margin:0;padding:28px 28px 28px 48px}
.panel li{margin-bottom:10px}
.panel li::marker{color:var(--flow-ink)}
.panel .group{font-family:var(--display);font-weight:600;font-size:19px;list-style:none;margin:16px 0 8px -20px}
.panel .group:first-child{margin-top:0}
.stepper{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);grid-column:1 / -1;font-size:15px}
.stepper button{background:none;border:0;color:var(--steel);font:inherit;font-weight:600;cursor:pointer;padding:6px 4px}
.stepper button:disabled{opacity:.35;cursor:default}
@media (max-width:860px){
  .pipe{grid-template-columns:1fr;gap:6px}
  .pipe::before{left:33px;right:auto;top:20px;bottom:20px;width:8px;height:auto}
  .pipe .flow{left:35px;right:auto;top:20px;bottom:20px;width:4px;height:auto;
    background:repeating-linear-gradient(180deg,var(--flow) 0 14px,transparent 14px 34px);background-size:4px 34px;animation:flowv 1.1s linear infinite}
  .pipe li{text-align:left}
  .node{flex-direction:row;gap:16px;padding:4px 0}
  .node .txt{align-items:flex-start}
  .panel{grid-template-columns:1fr}
  .panel .meta{border-right:0;border-bottom:1px solid var(--rule)}
}
@keyframes flowv{to{background-position:0 34px}}

/* capabilities */
.caps{display:grid;grid-template-columns:repeat(2,1fr);border-top:1.5px solid var(--ink)}
.cap{padding:28px 28px 28px 0;border-bottom:1px solid var(--rule)}
.cap:nth-child(odd){border-right:1px solid var(--rule)}
.cap:nth-child(even){padding-left:28px}
.cap h3{margin-bottom:10px;display:flex;gap:12px;align-items:center}
.cap h3 svg{flex:none;stroke:var(--flow-ink)}
.cap p{margin:0}
.cap .site{margin-top:12px;font-size:15px;color:var(--steel)}
@media (max-width:760px){.caps{grid-template-columns:1fr}.cap,.cap:nth-child(even){padding:24px 0;border-right:0}}

/* projects */
.proj{border-top:1.5px solid var(--ink)}
.proj details{border-bottom:1px solid var(--rule)}
.proj summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:120px 1fr auto;gap:24px;align-items:center;padding:24px 0}
.proj summary::-webkit-details-marker{display:none}
.proj .yr{font-family:var(--display);font-weight:600;font-size:20px;color:var(--steel)}
.proj summary h3{font-size:clamp(22px,2.6vw,30px)}
.proj summary .sub{display:block;font-family:var(--body);font-size:15px;color:var(--steel);font-weight:400;margin-top:6px;line-height:1.4}
.plus{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;transition:transform .25s}
details[open] .plus{transform:rotate(45deg);background:var(--ink);color:var(--paper)}
.proj .body{display:grid;grid-template-columns:120px repeat(3,1fr);gap:24px;padding:0 0 30px}
.proj .body h4{font-family:var(--display);font-size:18px;margin:0 0 6px;font-weight:600}
.proj .body p{font-size:16px;margin:0}
.proj .foot{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:13px;font-weight:500;padding:4px 10px;border:1px solid var(--rule);border-radius:20px;color:var(--steel);background:none;font-family:var(--body);cursor:pointer}
.tag:hover{border-color:var(--flow-ink);color:var(--ink)}
.linkbtn{margin-left:auto;font-size:14px;font-weight:600;background:none;border:0;color:var(--steel);cursor:pointer;font-family:var(--body);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.proj details.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--flow) 28%,transparent)}100%{background:transparent}}
@media (max-width:760px){
  .proj summary{grid-template-columns:1fr auto;gap:12px}
  .proj summary .yr{grid-column:1 / -1;margin-bottom:-8px}
  .proj .body{grid-template-columns:1fr}
  .proj .body .spacer{display:none}
  .proj .foot{grid-column:1}
}

/* skills */
.skill-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:26px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font-family:var(--body);font-size:15px;font-weight:500;padding:8px 16px;border-radius:24px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.filters button span{color:var(--steel);margin-left:4px;font-variant-numeric:tabular-nums}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters button[aria-pressed="true"] span{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.search{margin-left:auto;position:relative}
.search input{box-sizing:border-box;font:inherit;font-size:15px;padding:9px 14px 9px 38px;border:1.5px solid var(--rule);border-radius:24px;background:var(--surface);color:var(--ink);width:240px;max-width:100%}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);stroke:var(--steel)}
@media (max-width:760px){.search{margin-left:0;width:100%}.search input{width:100%}}
.skills{display:flex;flex-wrap:wrap;gap:10px;min-height:120px;align-content:flex-start}
.skill{padding:10px 16px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--flow);font-weight:500;transition:opacity .25s,transform .25s}
.skill.dim{opacity:.18;transform:scale(.97)}
.skill mark{background:color-mix(in srgb,var(--flow) 45%,transparent);color:inherit;border-radius:2px}
.empty{color:var(--steel);padding:12px 0}

/* education */
.edu{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1.5px solid var(--ink)}
.edu > div{padding:24px 24px 24px 0;border-right:1px solid var(--rule)}
.edu > div + div{padding-left:24px}
.edu > div:nth-child(3n){border-right:0}
.edu .yr{font-family:var(--display);font-weight:600;color:var(--steel)}
.edu h3{margin:6px 0 6px;font-size:22px}
.certs{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px}
.cert{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--rule);background:var(--surface)}
.cert b{font-weight:600}
.cert .st{font-size:13px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.cert .st.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.cert .st.progress{background:color-mix(in srgb,var(--focus) 16%,transparent);color:var(--focus)}
.cert .st.on-request{background:color-mix(in srgb,var(--flow) 22%,transparent);color:var(--flow-ink)}
.cert small{display:block;color:var(--steel);font-size:14px}
@media (max-width:760px){.edu{grid-template-columns:1fr}.edu > div,.edu > div + div{padding:20px 0;border-right:0;border-bottom:1px solid var(--rule)}}

/* contact */
.contact{background:var(--ink);color:var(--paper);padding:80px 0}
.contact h2{color:var(--paper)}
.contact .muted{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.lines{margin-top:36px;display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
.line{padding:26px 24px 26px 0;border-right:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
.line + .line{padding-left:24px}
.line:last-child{border-right:0}
.line .lbl{font-size:15px;color:color-mix(in srgb,var(--paper) 70%,transparent);display:flex;justify-content:space-between;gap:8px}
.line .lbl time{font-variant-numeric:tabular-nums}
.line .lbl time.off{color:color-mix(in srgb,var(--paper) 45%,transparent)}
.line .val{font-family:var(--display);font-weight:600;font-size:clamp(24px,2.6vw,30px);margin:6px 0 16px;word-break:break-word}
.line .acts{display:flex;flex-wrap:wrap;gap:8px}
.contact .btn{border-color:var(--paper);color:var(--paper);background:transparent;padding:9px 14px;font-size:15px}
.contact .btn.primary{background:var(--flow);border-color:var(--flow);color:#14303D}
.contact .btn.primary::before{display:none}
@media (max-width:860px){.lines{grid-template-columns:1fr}.line,.line + .line{padding:22px 0;border-right:0;border-bottom:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}}
footer{padding:28px 0 36px;font-size:14px;color:var(--steel)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* load / error states */
.loading .needs-data{visibility:hidden}
.fail{margin:40px auto;max-width:640px;padding:24px;border:1.5px solid var(--hold);background:var(--surface)}
.fail h3{margin-bottom:8px}
.fail code{font-size:14px}

/* single orchestrated load sequence */
.load{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.load.d1{animation-delay:.08s}.load.d2{animation-delay:.18s}.load.d3{animation-delay:.3s}.load.d4{animation-delay:.44s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .load{opacity:1;transform:none}
  html{scroll-behavior:auto}
}

/* printable CV: same data, laid out for paper */
.print-only{display:none}
@media print{
  @page{margin:14mm 14mm 16mm}
  :root{--paper:#fff;--surface:#fff;--ink:#14303D;--steel:#4F6772;--rule:#C5D1D6}
  body{font-size:11pt;line-height:1.45}
  body::before,header.bar,.ctas,.skill-tools,.iconbtn,.contact .acts,.toast,#career .pipe,#career .panel,.linkbtn,.plus,footer .upd{display:none!important}
  .print-only{display:block}
  .hero{padding:0 0 12px}.hero h1{font-size:40pt}.hero-grid{grid-template-columns:1.3fr 1fr;gap:24px}
  .load{opacity:1!important;transform:none!important;animation:none!important}
  section.block{padding:18px 0;break-inside:auto}
  .sec-head{margin-bottom:12px;grid-template-columns:1fr}.sec-head p{display:none}
  h2{font-size:20pt}
  .sec-head,h2,.pr-role h3{break-after:avoid}
  .caps{grid-template-columns:repeat(3,1fr)}.cap,.cap:nth-child(even){padding:10px 12px 10px 0;border-right:0}.cap h3{font-size:13pt}
  .pr-role{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--rule)}
  .pr-role h3{font-size:14pt}.pr-role ul{margin:4px 0 0;padding-left:18px}
  .proj summary{padding:10px 0}.proj .body{padding-bottom:12px}
  .proj details{break-inside:avoid}
  .skill{padding:3px 8px;font-size:9.5pt}.skill.dim{opacity:1;transform:none}
  .contact{background:none;color:#000;padding:18px 0}.contact h2,.contact .muted,.line .lbl{color:#000}
  .line,.line + .line{border-color:var(--rule)}
}
</style>
</head>
<body class="loading">

<header class="bar">
  <div class="wrap">
    <a class="mark" href="#top" aria-label="Back to top">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 17h22M11 11l12 12M23 11 11 23" stroke="var(--flow)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span data-bind="site.name">Sudarno Lamhot</span>
    </a>
    <nav class="links" aria-label="Sections" id="nav"></nav>
    <button class="iconbtn" id="themeBtn" aria-label="Switch colour theme" title="Switch colour theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="status load needs-data" id="status"><i></i><span></span></div>
        <h1 class="load d1" id="heroName">Sudarno<br>Lamhot</h1>
        <div class="role load d2" data-bind="site.role">IT infrastructure, data center &amp; ICT operations engineer</div>
        <p class="pitch load d2 needs-data" id="pitch"></p>
        <div class="ctas load d3 needs-data" id="ctas"></div>
      </div>
      <aside class="datasheet load d4 needs-data" aria-label="Profile summary">
        <div class="ds-head"><span>Engineer datasheet</span><span id="rev"></span></div>
        <dl id="datasheet"></dl>
      </aside>
    </div>
  </section>

  <div id="failBox" hidden></div>

  <section class="block" id="career" data-sec="career">
    <div class="wrap">
      <div class="sec-head"><h2></h2><p class="muted"></p></div>
      <ol class="pipe" role="tablist" aria-label="Career stops" id="pipe"></ol>
      <div class="panel" id="panel" role="tabpanel" aria-live="polite"></div>
      <div class="print-only" id="printCareer"></div>
    </div>
  </section>

  <section class="block" id="capabilities" data-sec="capabilities">
    <div class="wrap">
      <div class="sec-head"><h2></h2><p class="muted"></p></div>
      <div class="caps" id="caps"></div>
    </div>
  </section>

  <section class="block" id="projects" data-sec="projects">
    <div class="wrap">
      <div class="sec-head"><h2></h2><p class="muted"></p></div>
      <div class="proj" id="proj"></div>
    </div>
  </section>

  <section class="block" id="skills" data-sec="skills">
    <div class="wrap">
      <div class="sec-head"><h2></h2><p class="muted"></p></div>
      <div class="skill-tools">
        <div class="filters" id="filters" role="group" aria-label="Filter skills"></div>
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="skillSearch" placeholder="Search a system, e.g. Cisco" aria-label="Search skills"></label>
      </div>
      <div class="skills" id="skillList" aria-live="polite"></div>
    </div>
  </section>

  <section class="block" id="education" data-sec="education">
    <div class="wrap">
      <div class="sec-head"><h2></h2><p class="muted"></p></div>
      <div class="edu" id="edu"></div>
      <div class="certs" id="certs"></div>
    </div>
  </section>
</main>

<section class="contact" id="contact" data-sec="contact">
  <div class="wrap">
    <h2></h2>
    <p class="muted" style="margin-top:14px"></p>
    <div class="lines" id="lines"></div>
  </div>
</section>

<footer><div class="wrap"><span id="foot1"></span><span><span id="foot2"></span><span class="upd" id="updated"></span></span></div></footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   Semua isi halaman datang dari data/profile.json.
   Ubah isi lewat admin.html (form + simpan langsung ke GitHub)
   atau edit file JSON-nya. File ini tidak perlu disentuh.
   ============================================================ */
const DATA_URL = "data/profile.json";
const PREVIEW = new URLSearchParams(location.search).has("preview");

/* ---------- icons (line style, 24px grid) ---------- */
const ICON = {
  store:'<path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18M9 20v-6h6v6"/>',
  app:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h3M8 16h6"/>',
  factory:'<path d="M3 21V10l5 3V10l5 3V7l5 3V4h3v17zM7 17h2M12 17h2M17 17h2"/>',
  server:'<rect x="4" y="3" width="16" height="7" rx="1"/><rect x="4" y="14" width="16" height="7" rx="1"/><path d="M8 6.5h.01M8 17.5h.01M12 10v4"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  rig:'<path d="M12 2v4M8 22l4-16 4 16M9.5 14h5M8.7 18h6.6M3 22h18M6 10h12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  hard:'<path d="M3 18h18M5 18v-3a7 7 0 0 1 14 0v3M10 8V5h4v3"/>',
  net:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5M12 12l-6 5.5M12 12l6 5.5"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  cloud:'<path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>',
  fiber:'<path d="M3 12h4l2-5 3 10 2-5h7"/>'
};
const svg = (k,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||""}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* ---------- derived values: computed, never typed by hand ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty"];
const now = new Date();
const nowYM = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
const ym = s => { const [y,m] = (s||"").split("-").map(Number); return y ? {y, m:m||1} : null; };
const months = (a,b) => { const s = ym(a), e = ym(b||nowYM); return s && e ? (e.y-s.y)*12 + (e.m-s.m) + 1 : 0; };
const fmtYM = s => { const d = ym(s); return d ? `${MON[d.m-1]} ${d.y}` : ""; };
const dur = m => { const y = Math.floor(m/12), r = m%12; return [y && `${y} yr${y>1?"s":""}`, r && `${r} mo${r>1?"s":""}`].filter(Boolean).join(" ") || "1 mo"; };
const isNow = r => !r.next && r.start && !r.end;
const period = r => r.next ? "Available now" : `${fmtYM(r.start)} – ${r.end ? fmtYM(r.end) : "Present"}`;
const spanLabel = p => {
  if (p.label) return p.label;
  const s = ym(p.start), e = p.end ? ym(p.end) : null;
  if (!s) return "";
  if (!p.end) return `${s.y}–now`;
  return s.y === e.y ? `${s.y}` : `${s.y}–${String(e.y).slice(2)}`;
};

function derive(d){
  // Merge overlapping periods so parallel roles are not counted twice.
  const spans = d.career.filter(r=>!r.next && r.start).map(r=>{const s=ym(r.start), e=ym(r.end||nowYM); return [s.y*12+s.m, e.y*12+e.m]}).sort((a,b)=>a[0]-b[0]);
  let total = 0, cur = null;
  for (const [s,e] of spans){ if(!cur || s > cur[1]+1){ if(cur) total += cur[1]-cur[0]+1; cur=[s,e]; } else cur[1]=Math.max(cur[1],e); }
  if (cur) total += cur[1]-cur[0]+1;
  const years = Math.floor(total/12);
  const current = d.career.find(isNow);
  const n = d.projects.length;
  const t = {
    years, yearsWord: (WORDS[years]||String(years)).toLowerCase(), YearsWord: WORDS[years]||String(years),
    projectCount: n, ProjectCount: WORDS[n]||String(n),
    current: current ? `${current.company.replace(/\s*\(.*\)\s*/,"")}, ${current.place}` : "Open to new role",
    rev: d.updated ? new Date(d.updated).getFullYear() : now.getFullYear()
  };
  return { t, totalMonths: total, current };
}
let T = {};
const fill = s => String(s ?? "").replace(/\{(\w+)\}/g, (m,k) => k in T ? T[k] : m);

/* ---------- render ---------- */
let D = null, careerIdx = 0;

function render(d){
  D = d;
  const dv = derive(d); T = dv.t;
  document.body.classList.remove("loading");
  $("failBox").hidden = true;

  // head
  document.title = fill(d.site.metaTitle || `${d.site.name} — ${d.site.role}`);
  setMeta("description", fill(d.site.metaDescription));
  document.querySelectorAll('[data-bind="site.name"]').forEach(e=>e.textContent=d.site.name);
  document.querySelectorAll('[data-bind="site.role"]').forEach(e=>e.textContent=d.site.role);
  const parts = d.site.name.trim().split(/\s+/);
  $("heroName").innerHTML = parts.length > 1 ? `${esc(parts.slice(0,-1).join(" "))}<br>${esc(parts.at(-1))}` : esc(d.site.name);

  // sections: title + intro, hide empty ones, build nav
  const has = {career:d.career.length, capabilities:d.capabilities.length, projects:d.projects.length, skills:d.skills.length, education:d.education.length+(d.certifications||[]).length, contact:(d.contact?.lines||[]).length};
  document.querySelectorAll("[data-sec]").forEach(sec=>{
    const k = sec.dataset.sec, s = d.sections?.[k] || {};
    sec.hidden = !has[k];
    sec.querySelector("h2").textContent = fill(s.title);
    sec.querySelector("p.muted").textContent = fill(s.intro);
  });
  const navKeys = ["career","capabilities","projects","skills","contact"].filter(k=>has[k]);
  $("nav").innerHTML = navKeys.map(k=>`<a href="#${k}">${esc(k[0].toUpperCase()+k.slice(1))}</a>`).join("");
  watchNav(navKeys);

  // hero
  const h = d.hero || {};
  $("status").classList.toggle("hold", !h.available);
  $("status").querySelector("span").textContent = h.available ? h.status : (h.statusUnavailable || h.status);
  $("pitch").textContent = fill(h.pitch);
  const wa = (d.contact?.lines||[]).find(l=>l.type==="phone" && l.primary) || (d.contact?.lines||[]).find(l=>l.type==="phone");
  $("ctas").innerHTML =
    (wa ? `<a class="btn primary" href="https://wa.me/${digits(wa.value)}" target="_blank" rel="noopener">${esc(h.primaryCtaLabel||"Message on WhatsApp")}</a>` : "") +
    (h.secondaryCta?.label ? `<a class="btn" href="${esc(h.secondaryCta.href||"#projects")}">${esc(h.secondaryCta.label)}</a>` : "") +
    `<button class="btn" type="button" data-print>Save CV as PDF</button>`;
  $("rev").textContent = `Rev. ${T.rev}`;
  $("datasheet").innerHTML = (d.datasheet||[]).map(r=>`<dt>${esc(fill(r.label))}</dt><dd>${esc(fill(r.value))}</dd>`).join("");

  renderCareer(d);
  $("caps").innerHTML = d.capabilities.map(c=>`<div class="cap"><h3>${svg(c.icon,26)}${esc(c.title)}</h3><p>${esc(fill(c.text))}</p>${c.site?`<div class="site">${esc(c.site)}</div>`:""}</div>`).join("");
  renderProjects(d);
  renderSkills(d);
  renderEdu(d);
  renderContact(d);

  $("foot1").textContent = `© ${now.getFullYear()} ${d.site.name} · ${d.site.location}`;
  $("foot2").textContent = d.site.footerNote || "";
  showUpdated(d);
  jsonLd(d, dv);
}

function setMeta(name, content){ if(!content) return; let m=document.querySelector(`meta[name="${name}"]`); if(!m){m=document.createElement("meta");m.name=name;document.head.appendChild(m)} m.content=content; }
const digits = s => String(s).replace(/\D/g,"");

/* career line */
function renderCareer(d){
  const pipe = $("pipe"), list = d.career;
  pipe.style.setProperty("--n", list.length);
  pipe.innerHTML = `<span class="flow" aria-hidden="true"></span>` + list.map((r,i)=>`<li><button class="node${r.next?" next":""}${isNow(r)?" now":""}" role="tab" id="tab-${esc(r.id)}" aria-controls="panel" aria-selected="false" data-i="${i}">
      <span class="valve">${svg(r.icon,34)}</span>
      <span class="txt"><span class="yr">${r.next?"Next":esc((ym(r.start)||{}).y||"")}</span><span class="co">${esc(r.short||r.company)}</span></span></button></li>`).join("");
  const fromHash = list.findIndex(r=>location.hash===`#career-${r.id}`);
  const feat = list.findIndex(r=>r.featured);
  const cur = list.findIndex(isNow);
  showCareer(fromHash>=0 ? fromHash : feat>=0 ? feat : cur>=0 ? cur : 0);
  $("printCareer").innerHTML = list.filter(r=>!r.next).slice().reverse().map(r=>`<div class="pr-role"><h3>${esc(r.title)} · ${esc(r.company)}</h3>
     <div class="muted">${esc(period(r))} (${dur(months(r.start,r.end))}) · ${esc(r.place)}</div>
     <ul>${r.groups.flatMap(g=>g.items).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`).join("");
}
function showCareer(i, focus){
  const list = D.career; careerIdx = i; const r = list[i]; if(!r) return;
  const nodes = [...$("pipe").querySelectorAll(".node")];
  nodes.forEach((n,j)=>{n.setAttribute("aria-selected",j===i);n.tabIndex=j===i?0:-1});
  if (focus) nodes[i].focus();
  const panel = $("panel");
  panel.setAttribute("aria-labelledby","tab-"+r.id);
  panel.innerHTML = `<div class="meta"><h3>${esc(r.title)}</h3><div>${esc(r.company)}</div>
      <div class="when">${esc(period(r))}${r.next?"":`<span class="dur">· ${dur(months(r.start,r.end))}</span>`}</div><div class="muted">${esc(r.place)}</div>
      ${r.relevance?`<div class="rel"><b>${r.next?"What I’m looking for":"Why it matters in Oil & Gas"}</b>${esc(fill(r.relevance))}</div>`:""}</div>
    <ul>${(r.groups||[]).map(g=>(g.label?`<li class="group">${esc(g.label)}</li>`:"")+(g.items||[]).map(t=>`<li>${esc(fill(t))}</li>`).join("")).join("")}</ul>
    <div class="stepper"><button type="button" data-step="-1" ${i===0?"disabled":""}>‹ ${esc(list[i-1]?.short||"Earlier")}</button><button type="button" data-step="1" ${i===list.length-1?"disabled":""}>${esc(list[i+1]?.short||"Later")} ›</button></div>`;
}
$("pipe").addEventListener("click", e=>{const n=e.target.closest(".node"); if(!n) return; showCareer(+n.dataset.i); if(matchMedia("(max-width:860px)").matches) $("panel").scrollIntoView({behavior:"smooth",block:"start"});});
$("panel").addEventListener("click", e=>{const b=e.target.closest("[data-step]"); if(b) showCareer(careerIdx + +b.dataset.step);});
$("pipe").addEventListener("keydown", e=>{
  const n = D.career.length; let j=null;
  if(["ArrowRight","ArrowDown"].includes(e.key)) j=(careerIdx+1)%n;
  if(["ArrowLeft","ArrowUp"].includes(e.key)) j=(careerIdx-1+n)%n;
  if(e.key==="Home") j=0; if(e.key==="End") j=n-1;
  if(j!==null){e.preventDefault();showCareer(j,true)}
});

/* projects: deep-linkable via #p-<id> */
function renderProjects(d){
  const list = d.projects; // order = order in the JSON (reorder with ↑ ↓ in admin.html)
  const target = location.hash.startsWith("#p-") ? location.hash.slice(3) : null;
  $("proj").innerHTML = list.map((p,i)=>`<details id="p-${esc(p.id)}"${(target ? p.id===target : i===0)?" open":""}><summary><span class="yr">${esc(spanLabel(p))}</span>
     <h3>${esc(p.title)}<span class="sub">${esc(p.sub)}</span></h3>
     <span class="plus" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2"><path d="M7 1v12M1 7h12"/></svg></span></summary>
   <div class="body"><span class="spacer"></span>
     <div><h4>Situation</h4><p>${esc(fill(p.context))}</p></div>
     <div><h4>What I did</h4><p>${esc(fill(p.did))}</p></div>
     <div><h4>Outcome</h4><p>${esc(fill(p.result))}</p></div>
     <div class="foot">${(p.tags||[]).map(t=>`<button type="button" class="tag" data-tag="${esc(t)}" title="Find related skills">${esc(t)}</button>`).join("")}
       <button type="button" class="linkbtn" data-plink="${esc(p.id)}">Copy link to this project</button></div></div></details>`).join("");
  if (target){ const el=$("p-"+target); if(el) requestAnimationFrame(()=>{el.scrollIntoView({block:"start"}); el.classList.add("flash");}); }
}
$("proj").addEventListener("click", e=>{
  const l = e.target.closest("[data-plink]");
  if (l){ copy(`${location.origin}${location.pathname}#p-${l.dataset.plink}`, "Project link copied"); return; }
  const t = e.target.closest("[data-tag]");
  if (t){ const q = t.dataset.tag.split(/[·\/,]/)[0].trim(); $("skillSearch").value = q; skillState.q = q; skillState.cat = "All"; applySkills(); $("skills").scrollIntoView({behavior:"smooth"}); }
});

/* skills: category filter + search with live counts */
const skillState = { cat:"All", q:"" };
function renderSkills(d){
  const flat = d.skills.flatMap(g=>(g.items||[]).map(n=>({cat:g.category, name:n})));
  $("skillList").innerHTML = flat.map(s=>`<span class="skill" data-cat="${esc(s.cat)}" data-name="${esc(s.name)}">${esc(s.name)}</span>`).join("") + `<p class="empty" id="skillEmpty" hidden></p>`;
  const cats = [["All", flat.length], ...d.skills.map(g=>[g.category,(g.items||[]).length])];
  if (!cats.some(c=>c[0]===skillState.cat)) skillState.cat = "All";
  $("filters").innerHTML = cats.map(([c,n])=>`<button type="button" aria-pressed="${c===skillState.cat}" data-cat="${esc(c)}">${esc(c)}<span>${n}</span></button>`).join("");
  applySkills();
}
function applySkills(){
  const q = skillState.q.trim().toLowerCase(); let shown = 0;
  $("filters").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.cat===skillState.cat));
  $("skillList").querySelectorAll(".skill").forEach(s=>{
    const name = s.dataset.name, hit = (skillState.cat==="All"||s.dataset.cat===skillState.cat) && (!q || name.toLowerCase().includes(q) || s.dataset.cat.toLowerCase().includes(q));
    s.classList.toggle("dim", !hit); if (hit) shown++;
    const i = q ? name.toLowerCase().indexOf(q) : -1;
    s.innerHTML = i>=0 ? esc(name.slice(0,i))+`<mark>${esc(name.slice(i,i+q.length))}</mark>`+esc(name.slice(i+q.length)) : esc(name);
  });
  const em = $("skillEmpty"); em.hidden = shown>0; em.textContent = `No listed system matches “${skillState.q}”. Ask me directly; the list covers production work only.`;
}
$("filters").addEventListener("click", e=>{const b=e.target.closest("button"); if(!b) return; skillState.cat=b.dataset.cat; applySkills();});
$("skillSearch").addEventListener("input", e=>{skillState.q=e.target.value; applySkills();});

/* education + certifications */
function renderEdu(d){
  $("edu").innerHTML = d.education.map(e=>`<div><div class="yr">${esc(e.yr)}</div><h3>${esc(e.title)}</h3><div class="muted">${esc(e.where)}</div></div>`).join("");
  const label = {done:"Certified", progress:"In progress", "on-request":"On request"};
  $("certs").innerHTML = (d.certifications||[]).map(c=>`<div class="cert"><span class="st ${esc(c.status)}">${esc(label[c.status]||c.status)}${c.year?` ${esc(c.year)}`:""}</span><div><b>${esc(c.name)}</b>${c.note?`<small>${esc(c.note)}</small>`:""}</div></div>`).join("");
}

/* contact lines: actions generated from type */
function renderContact(d){
  const lines = d.contact?.lines || [];
  $("lines").style.setProperty("--n", Math.min(lines.length,3)||1);
  $("lines").innerHTML = lines.map(l=>{
    const acts = l.type==="email"
      ? `<a class="btn primary" href="mailto:${esc(l.value)}?subject=${encodeURIComponent("Opportunity for "+d.site.name)}">Send email</a>
         <a class="btn" href="mailto:${esc(l.value)}?subject=${encodeURIComponent("CV request")}">Request CV</a>`
      : `<a class="btn primary" href="https://wa.me/${digits(l.value)}" target="_blank" rel="noopener">WhatsApp</a>
         <a class="btn" href="tel:+${digits(l.value)}">Call</a>`;
    return `<div class="line"><div class="lbl"><span>${esc(l.label)}</span>${l.tz?`<time data-tz="${esc(l.tz)}" data-city="${esc(l.city||"")}">--:--</time>`:""}</div>
      <div class="val">${esc(l.value)}</div><div class="acts">${acts}<button type="button" class="btn" data-copy="${esc(l.value)}">Copy</button></div></div>`;
  }).join("");
  tick();
}
function tick(){
  document.querySelectorAll("time[data-tz]").forEach(t=>{
    try{
      const parts = new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:t.dataset.tz}).formatToParts(new Date());
      const hh = +parts.find(p=>p.type==="hour").value;
      const off = hh < 8 || hh >= 22;
      t.textContent = `${t.dataset.city} ${parts.map(p=>p.value).join("")}${off?" · likely asleep":""}`;
      t.classList.toggle("off", off);
    }catch(e){}
  });
}
setInterval(tick, 30000);

/* last updated: latest commit of the data file, falls back to the JSON stamp */
async function showUpdated(d){
  const fmt = iso => new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const el = $("updated");
  if (d.updated) el.textContent = ` · Updated ${fmt(d.updated)}`;
  if (PREVIEW || !d.site.repo || !location.hostname.endsWith("github.io")) return;
  try{
    const r = await fetch(`https://api.github.com/repos/${d.site.repo}/commits?path=${DATA_URL}&per_page=1`);
    if (!r.ok) return;
    const c = (await r.json())[0];
    if (c) el.textContent = ` · Updated ${fmt(c.commit.committer.date)}`;
  }catch(e){}
}

/* structured data for search engines */
function jsonLd(d, dv){
  let s = $("ld"); if(!s){ s=document.createElement("script"); s.type="application/ld+json"; s.id="ld"; document.head.appendChild(s); }
  const email = (d.contact?.lines||[]).find(l=>l.type==="email");
  s.textContent = JSON.stringify({
    "@context":"https://schema.org","@type":"Person", name:d.site.name, jobTitle:d.site.role, url:location.origin+location.pathname,
    email: email ? `mailto:${email.value}` : undefined,
    worksFor: dv.current ? {"@type":"Organization", name:dv.current.company} : undefined,
    alumniOf: d.education[0] ? {"@type":"CollegeOrUniversity", name:d.education[0].where} : undefined,
    address: {"@type":"PostalAddress", addressLocality:d.site.location},
    knowsAbout: d.skills.flatMap(g=>g.items)
  });
}

/* scroll spy, rebuilt when sections change */
let spy;
function watchNav(keys){
  spy?.disconnect();
  const links = [...document.querySelectorAll("nav.links a")];
  spy = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting) links.forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id)); }), {rootMargin:"-45% 0px -50% 0px"});
  keys.forEach(k=>{const el=$(k); if(el) spy.observe(el)});
}

/* copy + toast + print */
const toast = $("toast"); let tt;
function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("show"),1800)}
async function copy(v, msg){
  try{ await navigator.clipboard.writeText(v); say(msg||"Copied "+v); }
  catch(e){ const t=document.createElement("textarea"); t.value=v; document.body.appendChild(t); t.select(); try{document.execCommand("copy");say(msg||"Copied "+v)}catch(_){say(v)} t.remove(); }
}
document.addEventListener("click", e=>{
  const c = e.target.closest("[data-copy]"); if (c) copy(c.dataset.copy);
  if (e.target.closest("[data-print]")) window.print();
});
let openBefore = [];
addEventListener("beforeprint", ()=>{ openBefore=[...document.querySelectorAll("#proj details")].map(x=>x.open); document.querySelectorAll("#proj details").forEach(x=>x.open=true); });
addEventListener("afterprint", ()=>{ document.querySelectorAll("#proj details").forEach((x,i)=>x.open=openBefore[i]); });

/* theme toggle */
const root = document.documentElement;
try{ const t=localStorage.getItem("sl-theme"); if(t) root.dataset.theme=t; }catch(e){}
$("themeBtn").addEventListener("click", ()=>{
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("sl-theme", root.dataset.theme); }catch(e){}
});

/* ---------- boot ---------- */
function fail(err){
  document.body.classList.remove("loading");
  const local = location.protocol === "file:";
  $("failBox").hidden = false;
  $("failBox").innerHTML = `<div class="wrap"><div class="fail"><h3>Profile data did not load</h3>
    <p>${local ? `Browsers block <code>${DATA_URL}</code> when the page is opened as a file. Run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000</code>.`
      : `Check that <code>${DATA_URL}</code> exists and is valid JSON. The GitHub Action “Validate profile data” shows the exact line.`}</p>
    <p class="muted">${esc(err.message)}</p></div></div>`;
  document.querySelectorAll("[data-sec]").forEach(s=>s.hidden=true);
}
if (PREVIEW){
  // admin.html sends the draft here for a live preview
  addEventListener("message", e=>{ if(e.origin===location.origin && e.data?.type==="profile-preview"){ try{ render(e.data.profile); }catch(err){ fail(err); } } });
  parent.postMessage({type:"preview-ready"}, location.origin);
} else {
  fetch(`${DATA_URL}?v=${Date.now()}`, {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error(`HTTP ${r.status} for ${DATA_URL}`); return r.json(); })
    .then(render).catch(fail);
}
addEventListener("hashchange", ()=>{ if(!D) return; if(location.hash.startsWith("#p-")) renderProjects(D); const i=D.career.findIndex(r=>location.hash===`#career-${r.id}`); if(i>=0){ showCareer(i); $("career").scrollIntoView(); } });
</script>
</body>
</html>
