name: Validate profile data

on:
  push:
    paths: ["data/**", "scripts/validate.mjs"]
  pull_request:
    paths: ["data/**", "scripts/validate.mjs"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check data/profile.json
        run: node scripts/validate.mjs data/profile.json
